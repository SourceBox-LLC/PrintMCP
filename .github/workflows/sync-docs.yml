name: Sync Docs

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - 'docs/*.md'
      - 'docs/tutorials/**'
      - 'docs/tools/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'generate_docs.py'
      - '.github/workflows/sync-docs.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-docs
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run docs generator
        run: python3 generate_docs.py

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push to sync branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: auto-generate documentation mirror [$(date -u +%Y-%m-%dT%H:%M)]"
          # master is branch-protected (no direct push). Push to a dedicated
          # sync branch and merge via PR.
          SYNC_BRANCH="docs/auto-sync"
          git push --force origin "HEAD:${SYNC_BRANCH}"

      - name: Open, update, and merge sync PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SYNC_BRANCH="docs/auto-sync"
          PR_TITLE="docs: auto-generate documentation mirror"
          PR_BODY="Automated documentation mirror generation from the latest tutorials, tool reference, and project docs. Opened and auto-merged by the \`Sync Docs\` workflow (master is protected, so changes land via PR rather than direct push)."
          # Find an existing open PR for the sync branch, if any.
          EXISTING=$(gh pr list --head "${SYNC_BRANCH}" --base master --state open --json number --jq '.[0].number' || true)
          if [ -n "${EXISTING}" ]; then
            gh pr edit "${EXISTING}" --title "${PR_TITLE}" --body "${PR_BODY}"
            PR_NUMBER="${EXISTING}"
            echo "Updated existing PR #${PR_NUMBER}"
          else
            PR_URL=$(gh pr create --head "${SYNC_BRANCH}" --base master \
              --title "${PR_TITLE}" --body "${PR_BODY}")
            PR_NUMBER=$(echo "${PR_URL}" | grep -oE '[0-9]+$')
            echo "Opened new PR #${PR_NUMBER}"
          fi
          # Labels are cosmetic — apply best-effort, never fail the run.
          gh pr edit "${PR_NUMBER}" --add-label "documentation,automated" >/dev/null 2>&1 || true
          # After a force-push to the PR head, GitHub recomputes `mergeable`
          # asynchronously and briefly reports it as UNKNOWN / "not mergeable".
          # Calling `gh pr merge` in that window fails with
          # "GraphQL: Pull Request is not mergeable (mergePullRequest)".
          # Poll for mergeability first, then attempt the merge (with retries).
          wait_for_mergeable() {
            # $1 = PR number. Returns 0 once GitHub reports MERGEABLE, 1 on timeout.
            local pr="$1"
            local tries=30
            local state=""
            while [ "${tries}" -gt 0 ]; do
              state=$(gh pr view "${pr}" --json mergeable --jq '.mergeable' 2>/dev/null || echo "UNKNOWN")
              if [ "${state}" = "MERGEABLE" ]; then
                echo "PR #${pr} is mergeable (state=${state})"
                return 0
              fi
              echo "PR #${pr} mergeable=${state}; waiting for GitHub to recompute... (${tries} tries left)"
              sleep 5
              tries=$((tries - 1))
            done
            echo "::warning::Timed out waiting for PR #${pr} mergeability (last state=${state})"
            return 1
          }

          do_merge() {
            # $1 = PR number, $2 = extra gh pr merge flags. Retries on transient failures.
            local pr="$1"; shift
            local attempt=0
            local max=4
            while [ "${attempt}" -lt "${max}" ]; do
              if gh pr merge "${pr}" --squash --delete-branch --subject "${PR_TITLE}" "$@" 2>&1; then
                echo "Merged PR #${pr} (attempt $((attempt + 1))/${max})"
                return 0
              fi
              attempt=$((attempt + 1))
              if [ "${attempt}" -lt "${max}" ]; then
                echo "Merge attempt ${attempt}/${max} failed; re-checking mergeability and retrying..."
                wait_for_mergeable "${pr}" || true
                sleep 5
              fi
            done
            return 1
          }

          # Ensure GitHub has finished recomputing mergeability before we merge.
          wait_for_mergeable "${PR_NUMBER}" || true

          # Master has required status checks. A freshly opened PR won't have
          # them yet, so use --admin to bypass branch protection atomically.
          # ADMIN_TOKEN is a PAT with admin rights; GITHUB_TOKEN can't use --admin.
          ADMIN_TOKEN="${{ secrets.ADMIN_TOKEN }}"
          if [ -n "${ADMIN_TOKEN}" ]; then
            export GH_TOKEN="${ADMIN_TOKEN}"
            if do_merge "${PR_NUMBER}" --admin; then
              :
            else
              echo "::warning::Admin merge of PR #${PR_NUMBER} failed after retries — leaving open for manual merge"
            fi
          else
            # No admin token — try a regular merge (works if review requirement
            # is disabled and status checks have completed). If it fails, leave
            # the PR open for manual merge.
            if do_merge "${PR_NUMBER}"; then
              echo "Merged PR #${PR_NUMBER} without admin token"
            else
              echo "::warning::No ADMIN_TOKEN and merge failed — leaving PR #${PR_NUMBER} open for manual merge"
            fi
          fi